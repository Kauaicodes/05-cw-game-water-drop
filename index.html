<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Drop Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-wrapper">
        <img class="brand-logo" src="img/cw_logo-horizontal.png" alt="charity: water">
        <h1 class="game-title">Water Drop</h1>
        <p class="game-tagline">Catch clean drops. Avoid dirty water.</p>
        <div class="score-panel">
            <div class="score">Score: <span id="score" aria-live="polite">0</span></div>
            <div class="timer">Time: <span id="time">30</span>s</div>
            <label class="difficulty-control" for="difficulty">
                Difficulty:
                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="normal" selected>Normal</option>
                    <option value="hard">Hard</option>
                </select>
            </label>
            <div class="game-actions">
                <button id="start-btn">Start Game</button>
                <button id="reset-btn" type="button">Reset</button>
            </div>
        </div>
        <p id="game-message" aria-live="polite">Press Start Game when you're ready.</p>
        <div id="game-container" role="group" aria-label="Falling water drops game area"></div>
        <footer class="game-footer">
            <a href="https://www.charitywater.org/">Visit charity: water</a>
            <a href="https://www.charitywater.org/donate">Donate</a>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
